<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>КОСМОС 65 | Первый отряд космонавтов</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Дополнительные стили для страницы отряда */
        .cosmonauts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .cosmonaut-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .cosmonaut-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cosmonaut-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: filter 0.3s;
        }
        .cosmonaut-card:hover .cosmonaut-img {
            filter: grayscale(20%);
        }
        .cosmonaut-info {
            padding: 20px;
        }
        .cosmonaut-name {
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin: 0 0 5px;
        }
        .cosmonaut-dates {
            display: inline-block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 2px solid var(--gold);
            padding-left: 8px;
        }
        .cosmonaut-bio-short {
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .cosmonaut-missions {
            font-size: 0.8rem;
            color: var(--gold);
            font-family: monospace;
            border-top: 1px dashed var(--gold-dim);
            padding-top: 10px;
            margin-top: 10px;
        }
        /* Модальное окно (адаптация под большие биографии) */
        .modal-box {
            max-width: 900px;
            width: 90%;
            max-height: 85vh;
        }
        #modal-bio {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text);
            text-align: left;
        }
        #modal-bio h4 {
            color: var(--gold);
            margin-top: 20px;
            margin-bottom: 10px;
        }
        #modal-bio p {
            margin-bottom: 12px;
        }
        #modal-bio ul {
            margin: 10px 0 10px 20px;
        }
        .modal-img {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 15px;
        }
        .modal-header {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 20px;
        }
        .modal-header-text {
            flex: 1;
        }
        @media (max-width: 600px) {
            .cosmonauts-grid {
                grid-template-columns: 1fr;
            }
            .modal-header {
                flex-direction: column;
                text-align: center;
            }
        }

</head>

    <p style="text-align: center; font-size: 1.2rem; color: var(--text-muted); max-width: 800px; margin: 0 auto 50px;">20 героев, отобранных из 3461 лётчика. Они стали пионерами космоса. Нажмите на карточку, чтобы увидеть полную биографию.</p>

                <h4>Биография</h4>
                <p>Родился 12 февраля 1933 года. В июне 1952 года окончил 10 классов средней школы № 12 города Лиски. 11 июля 1952 года призван в армию. Окончил Ейское военно-морское авиационное училище им. И. В. Сталина в 1955 году, затем курсы в 114-м учебном истребительном авиаполку в Куйбышеве.</p>
                <p>С 18 августа 1956 года служил в морской авиации лётчиком 255-го истребительного авиаполка 91-й истребительной авиадивизии ВВС Северного флота. С 25 октября 1956 года — лётчик-оператор, с 30 ноября 1957 года — старший лётчик-оператор, с 18 декабря 1957 года — старший лётчик 524-го истребительного авиаполка 107-й истребительной авиадивизии ВВС Северного Флота. Летал на Як-25.</p>

                <p>В 1961–1963 годах учился в ВВИА им. Н. Е. Жуковского (не закончил). 17 апреля 1963 отчислен из отряда за нарушение дисциплины (вместе с Нелюбовым и Филатьевым в нетрезвом состоянии оказал сопротивление патрулю). Не летал.</p>
                <p>После отчисления служил старшим лётчиком в Дорохово, затем штурманом наведения в Бежецке. В сентябре 1975 вышел в запас в звании капитана. Награждён орденом Красной Звезды, шестью медалями. Умер от рака 20 августа 1992 года, похоронен в Бежецке.</p>

                <p>Участвовал в Советско-японской войне в составе 38-го гвардейского истребительного авиаполка Тихоокеанского флота. Освоил многие типы самолётов, налёт более 500 часов.</p>
                <p>В 1960 зачислен в отряд космонавтов (самый старший по возрасту и званию). 18–19 марта 1965 совершил полёт в качестве командира корабля «Восход-2». Во время полёта Алексей Леонов впервые вышел в открытый космос. На заключительном этапе вышла из строя система ориентации, и Беляев вручную сориентировал корабль и включил тормозную установку — впервые в пилотируемой космонавтике.</p>
                <p>Умер 10 января 1970 от интоксикации вследствие гнойного перитонита после операции. Похоронен на Новодевичьем кладбище.</p>

                <p><strong>Гибель:</strong> 23 марта 1961 года заканчивал десятисуточное пребывание в сурдобарокамере (давление снижено, кислород 40%). По одной версии, снимая датчики, протёр кожу спиртом и выбросил тампон на раскалённую спираль электроплитки. По другой — разматывая бинты, задел плитку. На нём загорелся шерстяной костюм. Из-за разницы давления барокамеру не могли быстро открыть. Бондаренко доставили в Боткинскую больницу, врачи 8 часов боролись за его жизнь, но он скончался за 19 дней до полёта Гагарина. У койки дежурили космонавты, включая Гагарина.</p>

                <p>Окончил Новосибирское авиационное училище лётчиков в 1955 году. Служил в ПВО. 28 апреля 1960 зачислен в отряд, проходил подготовку на «Востоке», вошёл в группу шести кандидатов на первый полёт.</p>

    const closeBtn = document.getElementById('closeModalBtn');

    const modalImg = document.getElementById('modal-img');
    const modalBio = document.getElementById('modal-bio');

    function openModal(cosmo) {
        modalName.innerText = cosmo.name;
        modalImg.src = cosmo.img;
        modalImg.alt = cosmo.name;
        // Если картинка не загрузилась, подставляем заглушку

        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
